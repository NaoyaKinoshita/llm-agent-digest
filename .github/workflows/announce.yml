# 新しいレポートが push されたら、ブログ記事の告知を X に自動投稿する
# 必要な Secrets: X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_TOKEN_SECRET
name: announce

on:
  push:
    branches: [main]
    paths:
      - "weekly/**"
      - "monthly/**"
      # daily/ と chiikawa/ は自動投稿しない。告知したい場合は workflow_dispatch で
      # 手動実行する（daily は weekly を告知の主軸にする方針のため、chiikawa は
      # SSG 生成前に X がカードをキャッシュする事故が起きたため）
  workflow_dispatch:
    inputs:
      path:
        description: "告知するレポートのパス（例: daily/2026/07/2026-07-12.md）"
        required: true
        type: string
      campaign:
        description: "UTM campaign（new_post / repost）"
        required: false
        default: "repost"
        type: choice
        options:
          - repost
          - new_post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save twitter-api-v2
      - run: node .github/scripts/announce.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL_PATH: ${{ inputs.path }}
          UTM_CAMPAIGN: ${{ inputs.campaign }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
